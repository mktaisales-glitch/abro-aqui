# Keeps the free Render instance warm during the judging window (it sleeps after 15 min idle).
# GitHub delays or skips short cron jobs on quiet repos, so each run pings for ~6 h and runs overlap.
name: keep-alive
on:
  schedule:
    - cron: "7 */3 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - run: |
          end=$((SECONDS + 350 * 60))
          while [ $SECONDS -lt $end ]; do
            curl -fsS -m 60 https://abro-aqui.onrender.com/api/health || true
            sleep 480
          done
